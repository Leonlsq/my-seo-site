name: Auto Generate Trending Articles

on:
  schedule:
    # 每天世界标准时间(UTC) 0点 和 12点运行一次（你可以随时改这个频率）
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 开启手动触发按钮，方便我们随时测试

permissions:
  contents: write # 赋予机器人写入和提交代码的权限

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        # 请确保下方 pip install 后面列出了你 Python 脚本用到的所有第三方库
        run: |
          python -m pip install --upgrade pip
          pip install requests openai beautifulsoup4
          
      - name: Run Auto Generation Script
        env:
          # 将 GitHub 保险箱里的密码注入给 Python 脚本使用
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} 
        run: |
          python auto_trend_generate.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "AutoPublisher"
          git config --global user.email "hello@scraping-trends.com"
          git add src/markdown/
          
          # 检查是否有新文件，如果有则提交并推送，没有则跳过避免报错
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-generated new trending articles" && git push)