name: Auto Generate Trending Articles

on:
  schedule:
    # 每天世界标准时间(UTC) 0点 和 12点运行一次
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 开启手动触发按钮，方便随时测试

# 并发控制，防止多个任务同时跑完互相抢占 push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 赋予写入和提交代码的权限

jobs:
  generate_and_publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openai beautifulsoup4
          
      - name: Run Auto Generation Script
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }} 
        run: |
          python auto_trend_generate.py

      - name: Commit and Push Changes
        run: |
          # 核心修改：使用你自己的 GitHub 用户名和绑定的真实邮箱，绕过 Vercel 对 Author 的拦截
          git config --global user.name "Leonlsq"
          git config --global user.email "leonlsqi@gmail.com"
          git add src/markdown/
          
          # 检查暂存区是否有变动
          if git diff --staged --quiet; then
            echo "No new articles generated. Skipping commit."
          else
            git commit -m "🤖 Auto-generated new trending articles"
            # 在 push 前先拉取远端可能产生的新提交，并通过 rebase 合并
            git pull --rebase origin main
            git push origin main
          fi